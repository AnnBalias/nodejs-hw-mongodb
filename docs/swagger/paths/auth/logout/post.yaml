tags:
  - Auth
summary: Logout
operationId: logout
description: 'Logout'
security:
  - bearerAuth: []
responses:
  '204':
    description: 'logged out'
  '401':
    description: Session not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Session not found'
            data:
              type: string
              example: 'Session not found'
