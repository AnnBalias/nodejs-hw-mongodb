tags:
  - Auth
summary: Password update request
operationId: requestResetEmail
description: 'Request for an email with a link to reset your password'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'User email'
            type: string
            example: 'bublik34@example.com'
responses:
  '200':
    description: 'Email has been successfully sent'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              example: {}
  '404':
    description: User not found or invalid email
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'User not found'
            data:
              type: string
              example: 'User not found'
