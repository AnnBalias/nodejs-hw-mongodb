tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum: ['name', 'phoneNumber', 'email', 'isFavourite', 'contactType']
      example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
  - in: query
    name: type
    schema:
      type: string
      enum: ['personal', 'work', 'home']
      example: 'work'
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: 'true'
responses:
  '200':
    description: 'Get contact list'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalitems
                - totalPages
                - hasNextPages
                - hasPreviousPages
              properties:
                data:
                  type: array
                  items:
                    type: object
                    required:
                      - _id
                      - name
                      - phoneNumber
                      - isFavourite
                      - contactType
                      - userId
                      - createdAt
                      - updatedAt
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 5
                totalitems:
                  type: integer
                  example: 50
                hasNextPages:
                  type: boolean
                  example: true
                hasPreviousPages:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
