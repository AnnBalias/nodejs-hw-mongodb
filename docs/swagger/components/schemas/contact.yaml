properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'Valera'
  phoneNumber:
    description: 'Contact number'
    type: string
    example: '+380123456789'
  email:
    description: 'Contact email'
    type: string
    example: 'bublik34@example.com'
  isFavourite:
    description: 'Add contact to favorites'
    type: boolean
    example: true
  contactType:
    description: 'Sselect the type of contact'
    enum: ['personal', 'work', 'home']
    type: string
    example: 'home'
  userId:
    description: 'User id'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contact photo'
    type: string
    example: https://res.cloudinary.com/dy4vxv2lf/image/upload/image.png
  createdAt:
    description: 'Automatically added when you post to a contact'
    type: string
    example: '2025-04-27T10:55:52.393Z'
  updatedAt:
    description: 'Automatically added when you post to a contact'
    type: string
    example: '2025-04-28T18:22:58.663Z'
