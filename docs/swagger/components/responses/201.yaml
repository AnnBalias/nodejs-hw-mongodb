description: Created a contact
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: 'Successfully created a contact!'
        data:
          type: object
          required:
            - _id
            - name
            - phoneNumber
            - isFavourite
            - contactType
            - userId
            - createdAt
            - updatedAt
          $ref: ../../components/schemas/contact.yaml
